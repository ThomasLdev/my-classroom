---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: docker compose up --wait --no-build
      - name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost
      # Uncomment when the homepage is configured, or change the path to check
      # - name: Check HTTPS reachability
      #   run: curl -v --insecure --fail-with-body https://localhost
      # Uncomment if Doctrine ORM is installed
      # - name: Create test database
      #   run: docker compose exec -T php bin/console -e test doctrine:database:create
      # Uncomment if Doctrine Migrations is installed
      # - name: Run migrations
      #   run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
      # Uncomment if PHPUnit is installed
      # - name: Run PHPUnit
      #   run: docker compose exec -T php bin/phpunit
      # Uncomment if Doctrine ORM is installed
      # - name: Doctrine Schema Validator
      #   run: docker compose exec -T php bin/console -e test doctrine:schema:validate

  quality:
    name: Quality
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: "!ChangeMe!"
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, intl, pdo_pgsql
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        uses: ramsey/composer-install@v3
      # phpstan-symfony reads the compiled container; warm it up so the XML exists.
      - name: Warm up container (for PHPStan)
        run: php bin/console cache:warmup --env=dev
      # Fail-fast order: style first (fast), then Rector, then the slower analysis.
      - name: Coding standard (ECS)
        run: composer ecs
      - name: Refactoring check (Rector)
        run: composer rector
      - name: Static analysis (PHPStan + PHPat)
        run: composer phpstan
      - name: Create test database
        run: php bin/console --env=test doctrine:database:create --if-not-exists
      - name: Run migrations
        run: php bin/console --env=test doctrine:migrations:migrate --no-interaction
      - name: Tests (PHPUnit)
        run: composer test

