---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # Build once. Every later step reuses this image: the running app that
      # Playwright drives, and (later) functional tests via `docker compose exec php`.
      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: docker compose up --wait --no-build
      - name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost
      # Unit suite needs no database; runs in the image built above (fail fast before E2E).
      - name: Unit tests (PHPUnit)
        run: docker compose exec -T -e APP_ENV=test php bin/phpunit --testsuite unit
      # The homepage redirects to a DB-backed calendar view, so E2E needs a
      # migrated schema (the running app uses APP_ENV=dev / the default database).
      - name: Prepare database (for E2E)
        run: docker compose exec -T php bin/console doctrine:migrations:migrate --no-interaction
      # Isolated step — reuses the image built above; the playwright service
      # reaches the already-running php service over the compose network.
      - name: E2E tests (Playwright)
        run: docker compose run --rm playwright
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7
      # The functional PHPUnit suite also needs a database; add it here later
      # (DB is already migrated above), e.g.:
      #   docker compose exec -T -e APP_ENV=test php bin/phpunit --testsuite functional

  front-lint:
    name: Front lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Lint front-end (Biome)
        run: docker run --rm -v "$PWD:/code" ghcr.io/biomejs/biome:2.4.4 ci assets

  quality:
    name: Quality
    runs-on: ubuntu-latest
    # Static analysis only — no database. Unit tests run in the `tests` job;
    # DB-backed schema validation + functional tests get their own setup later.
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, intl, pdo_pgsql
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        uses: ramsey/composer-install@v3
      # phpstan-symfony reads the compiled container; warm it up so the XML exists.
      - name: Warm up container (for PHPStan)
        run: php bin/console cache:warmup --env=dev
      # Fail-fast order: style first (fast), then Rector, then the slower analysis.
      - name: Coding standard (ECS)
        run: composer ecs
      - name: Refactoring check (Rector)
        run: composer rector
      - name: Static analysis (PHPStan + PHPat)
        run: composer phpstan

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint Code Base
        uses: super-linter/super-linter/slim@v8
        env:
          GITHUB_ACTIONS_CONFIG_FILE: actionlint.yaml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Whitelist mode: only the validators set to true run; every other
          # linter (Prettier formatters, JSCPD, codespell, natural-language,
          # PHP, ...) stays off. PHP is linted/tested in the Docker `tests`
          # job; front-end formatting is owned by project-native tooling.
          # NB: super-linter forbids mixing true and false — keep all-true here.
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_BASH: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true
          VALIDATE_GITLEAKS: true
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true
          VALIDATE_EDITORCONFIG: true
          # Skip vendored / generated / tool-managed files so linters ignore code we don't own.
          FILTER_REGEX_EXCLUDE: (assets/vendor/|var/|public/bundles/|\.serena/)
