---
# Development environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # Keep var/ off the bind-mount for faster I/O on Mac/Windows; comment to inspect from the host.
      - /app/var
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    environment:
      FRANKENPHP_WORKER_CONFIG: watch
      # hot_reload désactivé : il morphe le DOM live (idiomorph + SSE Mercure) et
      # peut "stranded" le <dialog> ouvert -> page bloquée. `watch` recharge le
      # code côté worker ; on rafraîchit le navigateur à la main.
      # FRANKENPHP_SITE_CONFIG: hot_reload
      MERCURE_EXTRA_DIRECTIVES: demo
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
      APP_ENV: "${APP_ENV:-dev}"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true

  # Front linter — official Biome image (Rust binary, no Node / no package.json).
  # On-demand task service: `docker compose run --rm biome ci assets`.
  biome:
    image: ghcr.io/biomejs/biome:2.4.4
    profiles: ["dev", "test", "ci"]
    working_dir: /code
    volumes:
      - ./:/code

  # E2E — official Playwright image (browsers + OS deps + SDK bundled).
  # The image tag MUST match @playwright/test in tests/e2e/package.json.
  # On-demand task service: `docker compose run --rm playwright`.
  playwright:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    profiles: ["dev", "test", "ci"]
    working_dir: /e2e
    depends_on:
      php:
        condition: service_healthy
    environment:
      PLAYWRIGHT_BASE_URL: "http://php"
    volumes:
      - ./tests/e2e:/e2e
      # Anonymous volume keeps the container-installed deps from being shadowed by the bind-mount.
      - /e2e/node_modules
    command: ["sh", "-c", "npm ci && npx playwright test"]
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432"
