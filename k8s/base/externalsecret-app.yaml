apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: my-classroom-secrets
  namespace: my-classroom
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: infisical
  target:
    name: my-classroom-secrets
    creationPolicy: Owner
  data:
    # Stored at the project root as MY_CLASSROOM_APP_SECRET (prefix-namespaced
    # to avoid clashing with tinie's own APP_SECRET at "/"); exposed to the pod
    # as APP_SECRET.
    - secretKey: APP_SECRET
      remoteRef:
        key: MY_CLASSROOM_APP_SECRET
