apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-classroom
  namespace: my-classroom
spec:
  ingressClassName: traefik
  tls:
    # The `my-classroom-tls` secret is created imperatively from a local CA
    # (see ~/pwa-ca), NOT by cert-manager — the CA is installed on the device
    # so the cert is trusted, which is what makes the Android PWA installable.
    # Don't add a cert-manager.io annotation here or it would overwrite it.
    - hosts:
        # sslip.io resolves <anything>.192.168.1.200.sslip.io -> 192.168.1.200,
        # so no local DNS entry is needed. Mobile must be on the same LAN.
        - my-classroom.192.168.1.200.sslip.io
      secretName: my-classroom-tls
  rules:
    - host: my-classroom.192.168.1.200.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-classroom
                port:
                  number: 80
