apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: infisical
  namespace: my-classroom
spec:
  provider:
    infisical:
      hostAPI: https://app.infisical.com
      auth:
        tokenAuthCredentials:
          accessToken:
            # Bootstrap exception: applied imperatively in this namespace,
            # never committed (see BOOTSTRAP). The JWT is a Machine Identity
            # Token Auth access token for the my-classroom-staging identity.
            key: accessToken
            name: infisical-machine-identity
      secretsScope:
        # Interim: Infisical free tier is out of project slots, so my-classroom
        # secrets live in a dedicated /my-classroom folder inside the existing
        # tinie-bakerie project (env staging). Move to a own project once
        # Infisical is self-hosted. The /my-classroom path keeps APP_SECRET
        # isolated from tinie's (they must NOT share the same value).
        projectSlug: tinie-bakerie-m8j-b
        environmentSlug: staging
        secretsPath: /my-classroom
