apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: infisical
  namespace: my-classroom
spec:
  provider:
    infisical:
      hostAPI: https://app.infisical.com
      auth:
        tokenAuthCredentials:
          accessToken:
            # Bootstrap exception: applied imperatively in this namespace,
            # never committed (see BOOTSTRAP). The JWT is a Machine Identity
            # Token Auth access token for the my-classroom-staging identity.
            key: accessToken
            name: infisical-machine-identity
      secretsScope:
        # Interim: Infisical free tier is out of project slots, so my-classroom
        # secrets live in the existing tinie-bakerie project (env staging).
        # The shared identity can only read the root path "/", and subfolder
        # scoping isn't workable on the free tier, so we keep secrets at "/"
        # and namespace them by key prefix (MY_CLASSROOM_*) instead of a folder.
        # Move to a dedicated project once Infisical is self-hosted.
        projectSlug: tinie-bakerie-m8j-b
        environmentSlug: staging
        secretsPath: /
